<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Página não encontrada — Cognis</title>
    <style>
      * { box-sizing: border-box; margin: 0; }
      body {
        font-family: system-ui, -apple-system, Arial, sans-serif;
        background: #f5f5f5; color: #111; min-height: 100vh;
        display: flex; align-items: center; justify-content: center; padding: 24px;
      }
      .box { max-width: 420px; width: 100%; text-align: center;
        border: 2px solid #111; background: #fff; padding: 40px 28px;
        box-shadow: 8px 8px 0 #111; }
      .logo { width: 56px; height: 56px; background: #111; color: #fff;
        font-weight: 800; font-size: 30px; display: inline-flex;
        align-items: center; justify-content: center; border-radius: 6px; margin-bottom: 20px; }
      h1 { font-size: 28px; letter-spacing: -0.02em; margin-bottom: 8px; }
      p { font-size: 14px; color: #555; line-height: 1.5; margin-bottom: 24px; }
      a { display: inline-block; background: #111; color: #fff; text-decoration: none;
        font-weight: 700; font-size: 14px; padding: 12px 22px; border-radius: 4px;
        box-shadow: 3px 3px 0 #555; }
      a:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #555; }
      @media (prefers-color-scheme: dark) {
        body { background: #141414; color: #ededed; }
        .box { border-color: #ededed; background: #1c1c1c; box-shadow: 8px 8px 0 #000; }
        .logo { background: #ededed; color: #141414; }
        p { color: #b3b3b3; }
        a { background: #ededed; color: #141414; box-shadow: 3px 3px 0 #000; }
      }
    </style>
  </head>
  <body>
    <main class="box">
      <div class="logo">C</div>
      <h1>Página não encontrada</h1>
      <p>O endereço que você tentou não existe (erro 404). Mas seu plano de estudos continua aqui.</p>
      <a href="/">Ir para o Cognis</a>
    </main>
  </body>
</html>
