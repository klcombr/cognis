    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "O Cognis é gratuito mesmo?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sim. Criar tópicos, praticar, revisar e acompanhar seu progresso é gratuito e sem limite de uso. Sem cartão, sem anúncios."
            }
          },
          {
            "@type": "Question",
            "name": "Como a IA decompõe o meu tema?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Você descreve o tema e a meta. A IA gera uma lista de conceitos com dependências entre eles (o que precisa vir antes) e uma ordem de estudo. Depois você pode editar, renomear, mover pré-requisitos e regenerar quando quiser."
            }
          },
          {
            "@type": "Question",
            "name": "Funciona para qualquer assunto?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "O Cognis foi desenhado para estudos acadêmicos, concursos, carreiras técnicas e idiomas. Se for conteúdo que pode ser quebrado em conceitos, funciona."
            }
          },
          {
            "@type": "Question",
            "name": "Meus dados são usados para treinar IA?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Não. Seus tópicos, respostas e progresso ficam no seu ambiente. A IA apenas gera conteúdo de estudo sob demanda, e você pode exportar tudo em JSON a qualquer momento."
            }
          },
          {
            "@type": "Question",
            "name": "Preciso instalar alguma coisa?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Não. O Cognis roda inteiro no navegador — no computador, tablet ou celular."
            }
          },
          {
            "@type": "Question",
            "name": "Como sei que estou evoluindo?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Cada conceito tem nível de conhecimento e confiança, com uma linha do tempo por conceito. Você vê erros por tipo, padrão de resposta, meta semanal e um gráfico de domínio geral do tópico."
            }
          }
        ]
      }
